name: Share to feed
description: Add a post, article or link to the Insights feed on orleone.dev.
title: "[feed] "
body:
  - type: markdown
    attributes:
      value: |
        Opening this issue adds the item to the feed, syncs new Medium articles and redeploys the site.
        Only the repository owner's issues are processed. Just the **URL** is required; anything left empty is
        filled in from the page's preview data when available (X and LinkedIn usually don't provide it, so paste the text yourself).
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://www.linkedin.com/posts/…
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Shared post
        - My post
        - Article
        - Talk
      default: 0
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Your note
      description: Why you're sharing it — shown above the quoted post.
  - type: textarea
    id: excerpt
    attributes:
      label: Excerpt
      description: The post text, or a short summary. Keep quotes of other people's posts short.
  - type: input
    id: author-name
    attributes:
      label: Author name
      description: For shared posts.
  - type: input
    id: author-handle
    attributes:
      label: Author handle
      placeholder: "@handle"
  - type: input
    id: title
    attributes:
      label: Title
      description: Mostly for articles and talks.
  - type: input
    id: date
    attributes:
      label: Date
      description: YYYY-MM-DD. Defaults to today.
  - type: input
    id: tags
    attributes:
      label: Tags
      placeholder: Swift, Architecture
  - type: input
    id: image
    attributes:
      label: Image URL
